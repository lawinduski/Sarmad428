  <!-- ⬇️ سکریپتا سێرچکرنێ (JavaScript) ⬇️ -->
  <script>
    function searchFiles() {
      let input = document.getElementById('fileSearchInput').value.toLowerCase();
      let cards = document.getElementsByClassName('file-card');

      for (let i = 0; i < cards.length; i++) {
        let fileName = cards[i].querySelector('.file-name').innerText.toLowerCase();
        if (fileName.includes(input)) {
          cards[i].style.display = "flex";
        } else {
          cards[i].style.display = "none";
        }
      }
    }
  </script>
