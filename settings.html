  <link rel="stylesheet" href="style.css">

<body>

      <!-- Telegram Chat -->
      <div class="setting-item">
        <div class="item-info">
          <span class="item-icon">💬</span>
          <span>Telegram Chat</span>
        </div>
        <a href="https://t.me/Sarmad428chat" target="_blank">

      <div class="setting-item">

  <!-- ⬇️ مینیۆیا ژێرێ (Bottom Navigation Bar) ⬇️ -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🏠</span>
      <span>Home</span>
    </a>
    <a href="apps.html" class="nav-item">
      <span>📱</span>

    </a>
    <a href="files.html" class="nav-item">

    </a>
    <a href="settings.html" class="nav-item active">
      <span>⚙️</span>
      <span>Setting</span>
    </a>
  </div>

  <script>
  // دەستنیشانکرنا لاپەڕەیا نها و چالاککرنا دوگما وێ
  document.addEventListener("DOMContentLoaded", function() {
    let currentPage = window.location.pathname.split("/").pop();
    if (currentPage === "") currentPage = "index.html"; // ئەگەر ماڵپەڕ ل سەر هۆستێ سەرەکی بیت

    let navItems = document.querySelectorAll(".bottom-nav .nav-item");
    navItems.forEach(item => {
      let href = item.getAttribute("href");
      if (href === currentPage) {
        item.classList.add("active");
      }
    });
  });
  </script>

</body>
</html>
